version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "requirements.txt" }}
            - v1-deps-
      - run:
          name: Install dependencies
          command: python -m pip install -r requirements.txt
      - save_cache:
          paths:
            - /home/circleci/.cache/pip
          key: v1-deps-{{ checksum "requirements.txt" }}
      - run:
          name: Run tests
          command: python -m pytest -v

  lint:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "requirements.txt" }}
            - v1-deps-
      - run:
          name: Install dependencies
          command: python -m pip install -r requirements.txt
      - save_cache:
          paths:
            - /home/circleci/.cache/pip
          key: v1-deps-{{ checksum "requirements.txt" }}
      - run:
          name: Check formatting
          command: python -m black --check app.py test_app.py

workflows:
  build-and-test:
    jobs:
      - test
      - lint
